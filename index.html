<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour toi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='24' font-size='26' text-anchor='middle'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3a3a3a;
    --bg1:#fbdde6;
    --wax:#5c2a42;
    --wax-light:#7d4560;
    --gold:#a98a63;
    --gold-dim:#8a745a;
    --paper:#f0c9d3;
    --paper-shadow:#dba9b7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg1);
    color:var(--ink);
    font-family:'Crimson Text', serif;
    min-height:100vh;
    padding:0 0 80px 0;
  }
  .hero{
    text-align:center;
    padding:90px 24px 50px;
  }
  .hero .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin-bottom:18px;
  }
  .hero h1{
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-style:normal;
    font-size:clamp(32px, 5.2vw, 54px);
    margin:0 0 18px;
    color:var(--ink);
    letter-spacing:0.01em;
  }
  .hero p{
    max-width:480px;
    margin:0 auto;
    font-size:18px;
    line-height:1.6;
    color:#5a5a5a;
  }
  .desk{
    max-width:920px;
    margin:40px auto 0;
    padding:0 24px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
    gap:28px;
    align-items:start;
  }
  .envelope{
    position:relative;
    background:linear-gradient(160deg, var(--paper) 0%, var(--paper-shadow) 100%);
    border-radius:6px;
    border:1px solid var(--wax);
    box-shadow:0 18px 40px rgba(0,0,0,0.18), 0 2px 0 rgba(255,255,255,0.08) inset;
    color:#2a1a12;
    overflow:hidden;
    min-height:230px;
    display:flex;
    flex-direction:column;
    transform:rotate(var(--tilt,0deg));
    transition:transform .35s ease;
  }
  .envelope:nth-child(2n){ --tilt:0.6deg; }
  .envelope:nth-child(3n){ --tilt:-0.6deg; }
  .envelope:hover{ transform:rotate(0deg) translateY(-4px); }
  .flap{
    position:absolute;
    top:0; left:0; right:0;
    height:96px;
    background:linear-gradient(135deg, #f6d9e0, #e0b7c3);
    clip-path:polygon(0 0, 50% 62%, 100% 0);
    transition:clip-path .5s cubic-bezier(.4,0,.2,1), height .5s ease;
  }
  .envelope.open .flap{
    clip-path:polygon(0 0, 50% 0%, 100% 0);
    height:0;
  }
  .seal{
    position:absolute;
    top:52px; left:50%;
    transform:translate(-50%,0);
    width:46px; height:46px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--wax-light), var(--wax) 70%);
    box-shadow:0 4px 8px rgba(0,0,0,0.25);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    color:#f6e6c9;
    font-size:13px;
    z-index:2;
    transition:opacity .3s ease, transform .3s ease;
  }
  .envelope.open .seal{ opacity:0; transform:translate(-50%,-10px) scale(.7); pointer-events:none; }

  .card-body{
    margin-top:96px;
    padding:20px 22px 24px;
    display:flex;
    flex-direction:column;
    gap:12px;
    flex:1;
    transition:margin-top .5s ease;
  }
  .envelope.open .card-body{ margin-top:20px; }

  .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:#8a5468;
  }
  .title{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    color:#2e2e2e;
  }
  .hint{
    font-size:15px;
    color:#4d4d4d;
    font-style:italic;
    line-height:1.4;
  }

  .lock-row{
    display:flex;
    gap:8px;
    margin-top:auto;
  }
  .lock-row input{
    flex:1;
    min-width:0;
    padding:10px 12px;
    border-radius:4px;
    border:1px solid #c893a3;
    background:#fffaf0;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:#2e2e2e;
  }
  .lock-row input:focus{ outline:2px solid var(--wax); outline-offset:1px; }
  .lock-row button{
    background:var(--wax);
    color:#fbe9d6;
    border:none;
    border-radius:4px;
    padding:0 16px;
    flex-shrink:0;
    white-space:nowrap;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    cursor:pointer;
    transition:background .2s ease;
  }
  .lock-row button:hover{ background:#482133; }
  .error{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--wax);
    min-height:16px;
  }

  .letter{
    display:none;
    flex-direction:column;
    gap:14px;
  }
  .envelope.open .lock-row, .envelope.open .locked-hint{ display:none; }
  .envelope.open .letter{ display:flex; }

  .letter p{
    font-size:17px;
    line-height:1.65;
    color:#2e2e2e;
    white-space:pre-wrap;
    overflow-wrap:break-word;
    max-width:60ch;
    margin:0;
  }
  .letter .gallery{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .letter .gallery img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:6px;
    box-shadow:0 6px 14px rgba(0,0,0,0.2);
  }
  .relock{
    align-self:flex-start;
    background:none;
    border:1px solid #c893a3;
    color:#4d4d4d;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.05em;
    padding:6px 10px;
    border-radius:4px;
    cursor:pointer;
    margin-top:4px;
  }

  footer{
    text-align:center;
    margin-top:70px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-dim);
  }

  @media (prefers-reduced-motion: reduce){
    .envelope, .flap, .seal, .card-body{ transition:none; }
  }

  .bg-hearts{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .bg-heart{
    position:absolute;
    bottom:-40px;
    color:var(--wax-light);
    opacity:0.18;
    animation-name:floatUp;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.18; }
    90%{ opacity:0.18; }
    100%{ transform:translateY(-110vh) rotate(25deg); opacity:0; }
  }
  .hero, .desk, footer{
    position:relative;
    z-index:1;
  }

  .confetti-heart{
    position:fixed;
    pointer-events:none;
    font-size:18px;
    z-index:50;
    animation-name:burst;
    animation-timing-function:ease-out;
    animation-fill-mode:forwards;
  }
  @keyframes burst{
    0%{ transform:translate(0,0) scale(0.6) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); opacity:0; }
  }
  @keyframes cardLift{
    0%{
      transform:translateY(0) scale(1) rotate(var(--tilt,0deg));
      box-shadow:0 18px 40px rgba(0,0,0,0.18), 0 2px 0 rgba(255,255,255,0.08) inset;
    }
    45%{
      transform:translateY(-16px) scale(1.035) rotate(0deg);
      box-shadow:0 32px 60px rgba(0,0,0,0.28), 0 2px 0 rgba(255,255,255,0.08) inset;
    }
    100%{
      transform:translateY(0) scale(1) rotate(var(--tilt,0deg));
      box-shadow:0 18px 40px rgba(0,0,0,0.18), 0 2px 0 rgba(255,255,255,0.08) inset;
    }
  }
  .envelope.lifting{
    animation:cardLift 0.6s ease;
    z-index:5;
  }


  /* Mode nuit/jour */
  .mode-toggle{
    position:fixed;
    top:18px;
    right:18px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid var(--wax);
    background:var(--bg1);
    color:var(--wax);
    font-size:18px;
    cursor:pointer;
    z-index:60;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .3s ease, color .3s ease;
  }
  body.night{
    --bg1:#241220;
    --ink:#f2e0e8;
    --paper:#5c3049;
    --paper-shadow:#42213a;
  }
  body.night .flap{
    background:linear-gradient(135deg, var(--paper), var(--paper-shadow));
  }
  body.night .title{ color:#f6e8ef; }
  body.night .hint{ color:#dfc3cf; }
  body.night .letter p{ color:#f2e0e8; }
  body.night .label{ color:#e6a9c1; }
  body.night .lock-row input{ background:#3a1f2e; color:#f2e0e8; border-color:#6b3a52; }
  body.night .relock{ color:#dfc3cf; border-color:#6b3a52; }
  body.night .hero p{ color:#d9bfc8; }
  body.night .compliment-box{ color:#f2e0e8; }

  /* Générateur de compliments */
  .compliment-trigger{
    display:block;
    text-align:center;
    margin:16px auto 0;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--wax);
    background:#e8aec0;
    border:1px solid var(--wax);
    border-radius:30px;
    padding:12px 22px;
    cursor:pointer;
    width:fit-content;
    transition:background .2s ease, color .2s ease;
  }
  .compliment-trigger:hover{ background:var(--wax); color:#fbe9d6; }
  body.night .compliment-trigger{
    background:#7d4560;
    border-color:#a8688a;
    color:#f8ecf1;
  }
  body.night .compliment-trigger:hover{ background:#96547a; }
  .compliment-box{
    max-width:420px;
    margin:18px auto 0;
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:21px;
    color:var(--ink);
    min-height:30px;
    padding:0 20px;
  }

  /* Machine à écrire */
  .type-cursor{
    display:inline-block;
    margin-left:2px;
    animation:blinkCursor 0.8s steps(1) infinite;
  }
  @keyframes blinkCursor{ 50%{ opacity:0; } }

  /* Apparition en fondu au scroll */
  .envelope{
    opacity:0;
    transform:translateY(24px) rotate(0deg);
    transition:transform .5s ease, opacity .6s ease, box-shadow .3s ease;
  }
  .envelope.in-view{
    opacity:1;
    transform:translateY(0) rotate(var(--tilt,0deg));
  }
  .envelope.in-view:hover{
    transform:rotate(0deg) translateY(-4px);
  }

  /* Bouton musique */
  .music-toggle{
    position:fixed;
    top:18px;
    left:18px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid var(--wax);
    background:var(--bg1);
    color:var(--wax);
    font-size:16px;
    cursor:pointer;
    z-index:60;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .music-panel{
    position:fixed;
    top:66px;
    left:18px;
    z-index:59;
    display:none;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
  }
  .music-panel.show{ display:block; }
  .music-panel iframe{
    display:block;
    border:none;
  }

  /* Réponse par email */
  .reply-wrap{
    max-width:420px;
    margin:60px auto 0;
    padding:0 24px;
    text-align:center;
  }
  .reply-title{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:22px;
    color:var(--ink);
    margin-bottom:12px;
  }
  .reply-textarea{
    width:100%;
    min-height:90px;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--wax);
    background:var(--paper);
    color:#2e2e2e;
    font-family:'Crimson Text', serif;
    font-size:15px;
    resize:vertical;
  }
  body.night .reply-textarea{ color:#f2e0e8; }
  .reply-send{
    margin-top:12px;
    background:var(--wax);
    color:#fbe9d6;
    border:none;
    border-radius:6px;
    padding:12px 22px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.05em;
    cursor:pointer;
  }
  .reply-send:hover{ background:#482133; }

  /* Câlin virtuel */
  .hug-trigger{
    display:block;
    text-align:center;
    margin:24px auto 0;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--wax);
    background:#e8aec0;
    border:1px solid var(--wax);
    border-radius:30px;
    padding:12px 22px;
    cursor:pointer;
    width:fit-content;
    transition:background .2s ease, color .2s ease;
  }
  .hug-trigger:hover{ background:var(--wax); color:#fbe9d6; }
  body.night .hug-trigger{
    background:#7d4560;
    border-color:#a8688a;
    color:#f8ecf1;
  }
  body.night .hug-trigger:hover{ background:#96547a; }
  .hug-overlay{
    position:fixed;
    inset:0;
    background:rgba(60,20,40,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:110;
  }
  .hug-overlay.show{ display:flex; }
  .hug-message{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:32px;
    color:#fff;
    text-align:center;
    padding:20px;
    text-shadow:0 4px 20px rgba(0,0,0,0.4);
  }
  .hug-heart{
    position:fixed;
    top:-40px;
    font-size:22px;
    color:#fff;
    animation-name:hugFall;
    animation-timing-function:linear;
    pointer-events:none;
    z-index:109;
  }
  @keyframes hugFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(360deg); opacity:0.15; }
  }
</style>
</head>
<body>

  <div class="bg-hearts" id="bgHearts"></div>

  <button class="mode-toggle" id="modeToggle">🌙</button>
  <button class="music-toggle" id="musicToggle">🎵</button>
  <div class="music-panel" id="musicPanel">
    <iframe id="spotifyFrame" src="" width="300" height="80" allow="encrypted-media"></iframe>
  </div>

  <div class="hero">
    <div class="eyebrow">des petites lettres selon tes besoins</div>
    <h1>DES PETITS MOTS D'AMOUR POUR ZOZO</h1>
    <p id="heroText"></p>
  </div>

  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <button class="compliment-trigger" id="complimentTrigger">Pioche un mot d'amour</button>
  <div class="compliment-box" id="complimentBox"></div>

  <div class="desk" id="desk"></div>

  <button class="hug-trigger" id="hugTrigger">Bouton d'amour</button>
  <div class="hug-overlay" id="hugOverlay">
    <div class="hug-message">JE T'AIME POUR TOUTE LA VIE 🤍</div>
  </div>

  <div class="reply-wrap">
    <div class="reply-title">Tu veux me dire quelque chose ?</div>
    <textarea id="replyText" class="reply-textarea" placeholder="Écris-moi un petit mot..."></textarea>
    <button class="reply-send" id="replySend">Envoyer 💌</button>
    <div class="compliment-box" id="replyStatus"></div>
  </div>

  <footer>
    je t'aime et je veux te faire des surprises d'amour chaque mois de ma vie zozo
  </footer>

<script>
/*
  ===========================================================
  MODIFIE TES LETTRES ICI.
  Pour chaque section :
    - id        : identifiant unique (pas d'espace)
    - seal      : 2-3 lettres affichées sur le cachet de cire
    - title     : titre de la carte (visible même fermée)
    - hint      : petite phrase visible même fermée
    - password  : le mot qu'elle doit taper pour ouvrir
    - text      : ton message. IMPORTANT : n'appuie JAMAIS sur Entrée
      à l'intérieur du texte entre guillemets. Pour un saut de ligne,
      tape les deux caractères \n à la place (backslash puis n).
    - images    : liste d'URLs d'images.
  ===========================================================
*/
const sections = [
  {
    id: "jetaime",
    seal: "<3",
    title: "quand tu as besoin de te rappeler à quel point je t'aime",
    hint: "",
    password: "jetaimesifort",
    text: "mon amour,\nj’ai besoin d’années entières pour exprimer tout ce qu’il se passe dans mon cœur et dans ma tête depuis que tu es là.\nje remercie Dieu d’avoir mis une femme comme toi sur mon chemin. t’as été une révélation pour moi, je me suis senti amoureux pour la première fois. j’ai découvert un autre objectif dans cette vie, celui de prendre soin de toi, faire attention à tout pour que tu ailles bien, que tu te sentes aimée, j’aime tellement t’apporter du positif et te voir sourire. j’adore faire des efforts pour toi, des efforts qui sont naturels et simples pour moi.\nt’es ma plus grande source d’inspiration dans tout ce que je fais, je mets beaucoup plus d’amour partout.\ntu es vraiment la plus belle chose qui me soit arrivée de toute ma vie. je veux vivre tous tes sourires, tes rires, tes pleurs. je veux profiter de tout ce que tu m’offres, de ne t’avoir que pour moi.\nje suis là pour être le meilleur pour toi, je sais que personne ne me rendra aussi heureux et obsédé, je sais que je serai la personne qui t’aimes le plus, parce que c’est indescriptible ce que j’ai envie pour toi et pour nous.\ntu sais, toutes les relations amoureuses sont risquées, mais je veux que tu saches que celle-ci ne l’est pas, je veux t’aimer pour toujours, que toi, je ne vois que toi quand je pense à plus tard.\ntu es la femme de mes rêves, dans tous les domaines tu es la première, je veux qu’une chose : que tu passes ta vie auprès de moi.\nje n’ai d’yeux que pour toi zoé, je me vois qu’avec toi, ta tendresse, ta douceur, ton naturel, ton visage, ton corps. tout ce que tu es, c’est tout ce que je rêvais d’avoir.",
    images: []
  },
  {
    id: "reconfort",
    seal: "<3",
    title: "quand tu as besoin de réconfort",
    hint: "",
    password: "amour",
    text: "mon amour, mets toi dans ton lit pour lire cette petite lettre.\nje veux que tu t’imagines être avec moi, imagine que je te prends dans mes bras et que tu te laisses te blottir contre moi pendant des heures, des jours, autant de temps que tu en as besoin.\n\nj’aimerais être près de toi toute les fois ou tu te sens mal, triste ou fatiguée. je veux te caresser les cheveux, te serrer fort contre moi et te couvrir d’amour.\nje veux que tu te souviennes que tu as pas besoin d’être forte tous les jours et que tu peux me parler de tout, de tes doutes, de ce qui te rend faible. je serai toujours là, toujours de ton côté. je veux que tu me donnes tous tes problèmes pour que tu n’aies plus à les résoudre ou les oublier seule, je veux tout faire pour effacer tout ce qui ne va pas.\nt’es tellement un bonheur, tu fais du bien aux gens sans t’en rendre compte, juste en étant toi même, j’aime tellement. je vais te donner toute la tendresse que je peux, surtout quand tu n’arrives plus à t’en donner, toi-même.\n\navec toi, j’arrive à être moi-même, je me sens tellement à ma place, je me sens en sécurité et j’espère que tu ressentiras la même chose avec moi. que tu sentiras que ma présence pourra t’éviter pleins de soucis, parce que je ferai toujours tout pour que tu ailles bien.\n\nje me sens prêt à tout traverser avec toi zoé, je choisirai toujours d’être à tes côtés et de prendre tous les chemins de ma vie avec toi. si un jour tout devient trop lourd à porter, que tu te sens trop triste, oublie jamais que je suis là pour toi, pour t’écouter, te rassurer, te faire oublier.\n\nje t’aime je t’aime je t’aime.",
    images: []
  },
  {
    id: "futur",
    seal: "<3",
    title: "quand tu imagines notre futur",

  entries.forEach(entry => {
    if (entry.isIntersecting){
      entry.target.classList.add('in-view');
      fadeInObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.15 });

      : '';

    card.innerHTML = `
      <div class="flap"></div>
      <div class="seal">${sec.seal}</div>
      <div class="card-body">
        <div class="label">Enveloppe scellée</div>
        <h3 class="title">${sec.title}</h3>
        <p class="hint locked-hint">${sec.hint}</p>

        <div class="lock-row">
          <input type="password" placeholder="mot de passe" data-id="${sec.id}">
          <button data-id="${sec.id}">Ouvrir</button>
        </div>
        <div class="error" id="error-${sec.id}"></div>

        <div class="letter">
          <p>${sec.text}</p>
          ${imagesHtml}
          <button class="relock" data-id="${sec.id}">Refermer</button>
        </div>
      </div>
    `;
    desk.appendChild(card);
    fadeInObserver.observe(card);
  });

  document.querySelectorAll('.lock-row button').forEach(btn => {
    btn.addEventListener('click', () => tryOpen(btn.dataset.id));
  });
  document.querySelectorAll('.lock-row input').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') tryOpen(inp.dataset.id);
    });
  });
  document.querySelectorAll('.relock').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = document.getElementById('card-' + btn.dataset.id);
      card.classList.remove('open');
      const input = card.querySelector('input');
      input.value = '';
      document.getElementById('error-' + btn.dataset.id).textContent = '';
    });
  });
}

function tryOpen(id){
  const sec = sections.find(s => s.id === id);
  const card = document.getElementById('card-' + id);
  const input = card.querySelector('input');
  const errorEl = document.getElementById('error-' + id);

  if (input.value === sec.password){
    card.classList.add('open');
    errorEl.textContent = '';
    spawnConfetti(card);
    card.classList.add('lifting');
    card.addEventListener('animationend', function handler(){
      card.classList.remove('lifting');
      card.removeEventListener('animationend', handler);
    });
    openedLetters.add(id);
    localStorage.setItem('lettres-ouvertes', JSON.stringify([...openedLetters]));
    updateProgress();
  } else {
    errorEl.textContent = 'Ce n\'est pas le bon mot… essaie encore.';
    card.animate(
      [{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],
      {duration:250}
    );
  }
}

// Confettis de cœurs à l'ouverture d'une enveloppe
function spawnConfetti(originEl){
  const rect = originEl.getBoundingClientRect();
  const originX = rect.left + rect.width / 2;
  const originY = rect.top + rect.height / 2;
  const count = 16;
  for (let i = 0; i < count; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-heart';
    piece.textContent = '♥';
    const angle = Math.random() * Math.PI * 2;
    const distance = 60 + Math.random() * 90;
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance - 40;
    piece.style.setProperty('--dx', dx + 'px');
    piece.style.setProperty('--dy', dy + 'px');
    piece.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
    piece.style.left = originX + 'px';
    piece.style.top = originY + 'px';
    piece.style.color = Math.random() > 0.5 ? '#5c2a42' : '#c9a86a';
    piece.style.animationDuration = (700 + Math.random() * 400) + 'ms';
    document.body.appendChild(piece);
    piece.addEventListener('animationend', () => piece.remove());
  }
}

const complimentTrigger = document.getElementById('complimentTrigger');

let lastComplimentIndex = -1;

function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}

function getComplimentUsage(){
  const raw = JSON.parse(localStorage.getItem('compliment-usage') || 'null');
  if (!raw || raw.date !== todayKey()) return { date: todayKey(), count: 0 };
  return raw;
}

complimentTrigger.addEventListener('click', () => {
  const usage = getComplimentUsage();

  if (usage.count >= 1){
    complimentBox.style.opacity = 0;
    setTimeout(() => {
      complimentBox.textContent = "Reviens demain pour un autre mot d'amour";
      complimentBox.style.transition = 'opacity .4s ease';
      complimentBox.style.opacity = 1;
    }, 150);
    return;
  }

  let index;
  do {
    index = Math.floor(Math.random() * complimentsList.length);
  } while (complimentsList.length > 1 && index === lastComplimentIndex);
  lastComplimentIndex = index;

  usage.count += 1;
  localStorage.setItem('compliment-usage', JSON.stringify(usage));

  complimentBox.style.opacity = 0;
  setTimeout(() => {
    complimentBox.textContent = complimentsList[index];
    complimentBox.style.transition = 'opacity .4s ease';
    complimentBox.style.opacity = 1;
  }, 150);
});

  ===========================================================
*/
const heroTypedText = "chaque lettre a un mot de passe différent mon cœur.\ndemande moi seulement quand tu voudras en lire une.";

function typeWriter(el, text, speed){
  el.innerHTML = '<span class="typed"></span><span class="type-cursor">|</span>';
  const typedSpan = el.querySelector('.typed');
  const cursor = el.querySelector('.type-cursor');
  let i = 0;
  function step(){
    if (i < text.length){
      const ch = text[i];
      typedSpan.innerHTML += (ch === '\n') ? '<br>' : ch;
      i++;
      setTimeout(step, speed);
    } else {
      cursor.remove();
    }
  }
  step();
}
typeWriter(document.getElementById('heroText'), heroTypedText, 32);

  IMPORTANT : la toute première fois qu'un message est envoyé,
  le service (FormSubmit, gratuit) t'enverra un email à toi pour
  confirmer que c'est bien ton adresse — il faut cliquer sur le
  lien de confirmation dans cet email UNE SEULE FOIS. Après ça,
  tous les messages suivants arrivent directement, sans confirmation.
  ===========================================================
*/
const REPLY_EMAIL = "0804c9b2176b26cc2fd94c53de8c6387";
const replySend = document.getElementById('replySend');
const replyStatus = document.getElementById('replyStatus');

replySend.addEventListener('click', async () => {
  const text = document.getElementById('replyText').value.trim();
  if (!text) return;

  replySend.disabled = true;
  replyStatus.textContent = "Envoi en cours...";

  try {
    const res = await fetch(`https://formsubmit.co/ajax/${REPLY_EMAIL}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        _subject: "Une réponse pour toi 💌",
        message: text
      })
    });

    if (res.ok){
      document.getElementById('replyText').value = '';
      replyStatus.textContent = "Envoyé ♥";
    } else {
      replyStatus.textContent = "Oups, ça n'a pas marché, réessaie.";
    }
  } catch (err){
    replyStatus.textContent = "Oups, ça n'a pas marché, réessaie.";
  }

  replySend.disabled = false;
});

<!DOCTYPE html>

<style>
  :root{
    --ink:#3a3a3a;
    --bg1:#fbdde6;
    --wax:#5c2a42;
    --wax-light:#7d4560;
    --gold:#a98a63;
    --gold-dim:#8a745a;
    --paper:#f0c9d3;
    --paper-shadow:#dba9b7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg1);
    color:var(--ink);
    font-family:'Crimson Text', serif;
    min-height:100vh;
    padding:0 0 80px 0;
  }
  .hero{
    text-align:center;
    padding:90px 24px 50px;
  }
  .hero .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin-bottom:18px;
  }
  .hero h1{
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-style:normal;
    font-size:clamp(32px, 5.2vw, 54px);
    margin:0 0 18px;
    color:var(--ink);
    letter-spacing:0.01em;
  }
  .hero p{
    max-width:480px;
    margin:0 auto;
    font-size:18px;
    line-height:1.6;
    color:#5a5a5a;
  }
  .desk{
    max-width:920px;
    margin:40px auto 0;
    padding:0 24px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
    gap:28px;
    align-items:start;
  }
  .envelope{
    position:relative;
    background:linear-gradient(160deg, var(--paper) 0%, var(--paper-shadow) 100%);
    border-radius:6px;
    border:1px solid var(--wax);
    box-shadow:0 18px 40px rgba(0,0,0,0.18), 0 2px 0 rgba(255,255,255,0.08) inset;
    color:#2a1a12;
    overflow:hidden;
    min-height:230px;
    display:flex;
    flex-direction:column;
    transform:rotate(var(--tilt,0deg));
    transition:transform .35s ease;
  }
  .envelope:nth-child(2n){ --tilt:0.6deg; }
  .envelope:nth-child(3n){ --tilt:-0.6deg; }
  .envelope:hover{ transform:rotate(0deg) translateY(-4px); }
  .flap{
    position:absolute;
    top:0; left:0; right:0;
    height:96px;
    background:linear-gradient(135deg, #f6d9e0, #e0b7c3);
    clip-path:polygon(0 0, 50% 62%, 100% 0);
    transition:clip-path .5s cubic-bezier(.4,0,.2,1), height .5s ease;
  }
  .envelope.open .flap{
    clip-path:polygon(0 0, 50% 0%, 100% 0);
    height:0;
  }
  .seal{
    position:absolute;
    top:52px; left:50%;
    transform:translate(-50%,0);
    width:46px; height:46px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--wax-light), var(--wax) 70%);
    box-shadow:0 4px 8px rgba(0,0,0,0.25);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    color:#f6e6c9;
    font-size:13px;
    z-index:2;
    transition:opacity .3s ease, transform .3s ease;
  }
  .envelope.open .seal{ opacity:0; transform:translate(-50%,-10px) scale(.7); pointer-events:none; }

  .card-body{
    margin-top:96px;
    padding:20px 22px 24px;
    display:flex;
    flex-direction:column;
    gap:12px;
    flex:1;
    transition:margin-top .5s ease;
  }
  .envelope.open .card-body{ margin-top:20px; }

  .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:#8a5468;
  }
  .title{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    color:#2e2e2e;
  }
  .hint{
    font-size:15px;
    color:#4d4d4d;
    font-style:italic;
    line-height:1.4;
  }

  .lock-row{
    display:flex;
    gap:8px;
    margin-top:auto;
  }
  .lock-row input{
    flex:1;
    min-width:0;
    padding:10px 12px;
    border-radius:4px;
    border:1px solid #c893a3;
    background:#fffaf0;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:#2e2e2e;
  }
  .lock-row input:focus{ outline:2px solid var(--wax); outline-offset:1px; }
  .lock-row button{
    background:var(--wax);
    color:#fbe9d6;
    border:none;
    border-radius:4px;
    padding:0 16px;
    flex-shrink:0;
    white-space:nowrap;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    cursor:pointer;
    transition:background .2s ease;
  }
  .lock-row button:hover{ background:#482133; }
  .error{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--wax);
    min-height:16px;
  }

  .letter{
    display:none;
    flex-direction:column;
    gap:14px;
  }
  .envelope.open .lock-row, .envelope.open .locked-hint{ display:none; }
  .envelope.open .letter{ display:flex; }

  .letter p{
    font-size:17px;
    line-height:1.65;
    color:#2e2e2e;
    white-space:pre-wrap;
    overflow-wrap:break-word;
    max-width:60ch;
    margin:0;
  }
  .letter .gallery{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .letter .gallery img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:6px;
    box-shadow:0 6px 14px rgba(0,0,0,0.2);
  }
  .relock{
    align-self:flex-start;
    background:none;
    border:1px solid #c893a3;
    color:#4d4d4d;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.05em;
    padding:6px 10px;
    border-radius:4px;
    cursor:pointer;
    margin-top:4px;
  }

  footer{
    text-align:center;
    margin-top:70px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-dim);
  }

  @media (prefers-reduced-motion: reduce){
    .envelope, .flap, .seal, .card-body{ transition:none; }
  }

  .bg-hearts{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .bg-heart{
    position:absolute;
    bottom:-40px;
    color:var(--wax-light);
    opacity:0.18;
    animation-name:floatUp;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.18; }
    90%{ opacity:0.18; }
    100%{ transform:translateY(-110vh) rotate(25deg); opacity:0; }
  }
  .hero, .desk, footer{
    position:relative;
    z-index:1;
  }

  .confetti-heart{
    position:fixed;
    pointer-events:none;
    font-size:18px;
    z-index:50;
    animation-name:burst;
    animation-timing-function:ease-out;
    animation-fill-mode:forwards;
  }
  @keyframes burst{
    0%{ transform:translate(0,0) scale(0.6) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); opacity:0; }
  }
</style>
</head>

const desk = document.getElementById('desk');

function renderSections(){
  desk.innerHTML = "";
  sections.forEach(sec => {
    const card = document.createElement('div');
    card.className = 'envelope';
    card.id = 'card-' + sec.id;

    const imagesHtml = (sec.images && sec.images.length)
      ? `<div class="gallery">${sec.images.map(src => `<img src="${src}" alt="">`).join('')}</div>`
      : '';

    card.innerHTML = `
      <div class="flap"></div>
      <div class="seal">${sec.seal}</div>
      <div class="card-body">
        <div class="label">Enveloppe scellée</div>
        <h3 class="title">${sec.title}</h3>
        <p class="hint locked-hint">${sec.hint}</p>

        <div class="lock-row">
          <input type="password" placeholder="mot de passe" data-id="${sec.id}">
          <button data-id="${sec.id}">Ouvrir</button>
        </div>
        <div class="error" id="error-${sec.id}"></div>

        <div class="letter">
          <p>${sec.text}</p>
          ${imagesHtml}
          <button class="relock" data-id="${sec.id}">Refermer</button>
        </div>
      </div>
    `;
    desk.appendChild(card);
  });

  document.querySelectorAll('.lock-row button').forEach(btn => {
    btn.addEventListener('click', () => tryOpen(btn.dataset.id));
  });
  document.querySelectorAll('.lock-row input').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') tryOpen(inp.dataset.id);
    });
  });
  document.querySelectorAll('.relock').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = document.getElementById('card-' + btn.dataset.id);
      card.classList.remove('open');
      const input = card.querySelector('input');
      input.value = '';
      document.getElementById('error-' + btn.dataset.id).textContent = '';
    });
  });
}

function tryOpen(id){
  const sec = sections.find(s => s.id === id);
  const card = document.getElementById('card-' + id);
  const input = card.querySelector('input');
  const errorEl = document.getElementById('error-' + id);

  if (input.value === sec.password){
    card.classList.add('open');
    errorEl.textContent = '';
    spawnConfetti(card);
  } else {
    errorEl.textContent = 'Ce n\'est pas le bon mot… essaie encore.';
    card.animate(
      [{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],
      {duration:250}
    );
  }
}

// Cœurs flottants en fond
function spawnBackgroundHearts(){
  const container = document.getElementById('bgHearts');
  const count = 14;
  for (let i = 0; i < count; i++){
    const heart = document.createElement('div');
    heart.className = 'bg-heart';
    heart.textContent = '♥';
    const size = 12 + Math.random() * 22;
    heart.style.left = (Math.random() * 100) + 'vw';
    heart.style.fontSize = size + 'px';
    const duration = 14 + Math.random() * 12;
    heart.style.animationDuration = duration + 's';
    heart.style.animationDelay = (-Math.random() * duration) + 's';
    container.appendChild(heart);
  }
}
spawnBackgroundHearts();

// Confettis de cœurs à l'ouverture d'une enveloppe
function spawnConfetti(originEl){
  const rect = originEl.getBoundingClientRect();
  const originX = rect.left + rect.width / 2;
  const originY = rect.top + rect.height / 2;
  const count = 16;
  for (let i = 0; i < count; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-heart';
    piece.textContent = '♥';
    const angle = Math.random() * Math.PI * 2;
    const distance = 60 + Math.random() * 90;
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance - 40;
    piece.style.setProperty('--dx', dx + 'px');
    piece.style.setProperty('--dy', dy + 'px');
    piece.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
    piece.style.left = originX + 'px';
    piece.style.top = originY + 'px';
    piece.style.color = Math.random() > 0.5 ? '#5c2a42' : '#c9a86a';
    piece.style.animationDuration = (700 + Math.random() * 400) + 'ms';
    document.body.appendChild(piece);
    piece.addEventListener('animationend', () => piece.remove());
  }
}

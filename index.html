<style>
  :root{
    --ink:#3a3a3a;
    --bg1:#fbdde6;
    --wax:#5c2a42;
    --wax-light:#7d4560;
    --gold:#a98a63;
    --gold-dim:#8a745a;
    --paper:#f0c9d3;
    --paper-shadow:#dba9b7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg1);
    color:var(--ink);
    font-family:'Crimson Text', serif;
    min-height:100vh;
    padding:0 0 80px 0;
  }
  .hero{
    text-align:center;
    padding:90px 24px 50px;
  }
  .hero .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin-bottom:18px;
  }
  .hero h1{
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-style:normal;
    font-size:clamp(32px, 5.2vw, 54px);
    margin:0 0 18px;
    color:var(--ink);
    letter-spacing:0.01em;
  }
  .hero p{
    max-width:480px;
    margin:0 auto;
    font-size:18px;
    line-height:1.6;
    color:#5a5a5a;
  }
  .desk{
    max-width:920px;
    margin:40px auto 0;
    padding:0 24px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
    gap:28px;
    align-items:start;
  }
